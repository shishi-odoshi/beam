name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # erlef/setup-beam does not support macOS runners; macOS coverage is
    # local-only (see README).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - run: mix deps.get
      - run: mix test

  # Cross-implementation contract tests (test/contract/): the BEAM supervisor
  # against real Ruby children using the published otp-rails gem, and the Ruby
  # supervisor against an Elixir child. A failure here and a green `test` job
  # means the two implementations disagree on the §5 wire contract.
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - run: gem install otp-rails --version 0.1.1
      - run: mix deps.get
      - run: mix test --only contract

  # Shared job queue interop tests (test/queue/, tagged :queue): the beam
  # Solid Queue worker and a REAL solid_queue Ruby worker running
  # concurrently against one Postgres schema — cross-claim, failure-interop,
  # and kill -9 orphan-pruning proofs. Separate job so a queue failure is
  # immediately distinguishable from a §5 contract or Elixir regression.
  queue:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otp_rails_beam_queue_test
        ports:
          - "55433:5432" # matches the suite's local-docker default port
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: test/fixtures/solid_queue
      - run: mix deps.get
      - run: mix test --only queue

  # Cable interop tests (test/cable/, tagged :cable): OtpRailsBeam.Cable
  # serving the ActionCable v1 JSON protocol against the REAL solid_cable +
  # turbo-rails stack — Ruby signs the stream names and broadcasts through
  # Solid Cable's pubsub; an Elixir websocket client asserts the frames.
  # Separate job so a cable failure is immediately distinguishable from a
  # queue, contract, or Elixir regression.
  cable:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otp_rails_beam_cable_test
        ports:
          - "55433:5432" # matches the suite's local-docker default port
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
          working-directory: test/fixtures/solid_cable
      - run: mix deps.get
      - run: mix test --only cable
        env:
          # The DB-outage test stops/starts the real Postgres under the
          # suite; in CI that's this job's service container.
          CABLE_PG_CONTAINER: ${{ job.services.postgres.id }}
