name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # erlef/setup-beam does not support macOS runners; macOS coverage is
    # local-only (see README).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - run: mix deps.get
      - run: mix test
